[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proto-clean"
version = "0.2.0"
description = "Clean-room client for ProtonVPN on Windows 7+, macOS 10.15+, Linux and Android 8+: backend-browser login, server-load selection, WireGuard, OpenVPN, Xray (VLESS REALITY / Trojan) with SNI masking, local blocklist ad-blocking, split tunneling, NAT-PMP port forwarding"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "playwright>=1.40",
    "dnslib>=0.9.25",
    "httpx>=0.25",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
proto-clean = "proto_clean.__main__:main"

[tool.setuptools.packages.find]
include = ["proto_clean*"]
