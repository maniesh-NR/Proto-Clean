[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proto-clean"
version = "0.6.1"
description = "Clean-room client for ProtonVPN on Windows 7+, macOS 10.15+, Linux and Android 8+: 25+ protocol engines (Shadowsocks, VMess, VLESS REALITY, Hysteria 2, TUIC, MASQUE, NaïveProxy, AmneziaWG, Cloak, Tor, Obscura, WARP, samizdat…), Clash/V2ray/sing-box import, multiprotocol chains, link bonding, split tunneling, NAT-PMP"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.6",
    "playwright>=1.40",
    "dnslib>=0.9.25",
    "httpx>=0.25",
    "keyring>=24",
    "aioquic>=1.2",
    "pyyaml>=6.0",
    "zxing-cpp>=2.1",
    "segno>=1.5",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
proto-clean = "proto_clean.__main__:main"

[tool.setuptools.packages.find]
include = ["proto_clean*"]
