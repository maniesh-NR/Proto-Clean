            ## Protocols (new)
            * **Built-in engines** (no extra binaries): Shadowsocks AEAD,
              Hysteria 2 (official wire protocol + salamander obfs), TUIC
              v5, MASQUE CONNECT-UDP over HTTP/3, Cover-DTLS (DTLS 1.2
              covert transport), IKEv2 (strongSwan / rasdial / Apple
              profiles), Tor (bridges: obfs4, snowflake, webtunnel).
            * **Through lantern-box**: VMess (ws/grpc/h2 + uTLS),
              ShadowsocksR, NaïveProxy, AmneziaWG (junk packets + magic
              headers), Reflex, WATER, Outline smart dialer, ALGeneva —
              with automatic capability probing (`box check`).
            * **Clash / V2ray / V2fly / sing-box**: import YAML/JSON
              configs, or run any sing-box config verbatim (passthrough).
              Subscription URLs auto-detect the format (plain links,
              base64, Clash YAML, sing-box JSON).
            * **Import**: clipboard, QR on screen, QR images, config
              files (.conf/.ovpn/.yaml/.json/.txt), subscriptions. Share
              any profile as a QR code.
            * **Cloudflare WARP hops**: register with Cloudflare (the
              oblivion / warp-plus way) and chain **WARP → protocol** or
              **protocol → WARP** with one click.
            * **Chains**: compose any engines (`client → VMess → Tor →
              internet`); QUIC engines tunnel through SOCKS5 UDP relays,
              Xray uses dialerProxy, lantern-box uses detour.
            * Settings → **Protocols** (or the tray menu).

            ## Also in this release
            * v0.4.0's **link bonding** (multi-adapter Speedify-style),
              samizdat bundling and the GPL-3 relicense carry over.
            * 678 automated tests; Python 3.8 (Windows 7) to 3.12.

            ## After install
            * Log in with your own Proton account (credentials stay in your
              system keyring; TOTP auto-fill optional).
            * Linux/macOS: enable passwordless privileged verbs via the
              helper + sudoers line (printed by the deb postinst / see
              `scripts/install.sh`, `scripts/install_macos.sh`).
            * Flatpak note: the sandbox cannot run the privileged
              WireGuard/OpenVPN helper — use the protocol engines and
              the DNS ad-blocker mode there.

