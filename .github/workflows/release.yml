name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: 0.6.2
  # lantern-box (Lantern's GPL-3 sing-box fork) — the samizdat engine we
  # bundle. Pinned tag; the port job builds it from source for every
  # target platform (official releases only publish linux binaries).
  LANTERN_BOX_VERSION: v0.0.189
  # Go toolchain used to port lantern-box (keep in sync with its go.mod)
  GO_TARBALL: go1.26.10.linux-amd64.tar.gz

jobs:
  # -------------------------------------------------------- lantern-box port
  # Proto Clean is GPL-3.0-or-later, so we may ship Lantern's engine.
  # Cross-compiled from the pinned source with the tag set lantern-box's
  # own goreleaser uses (minus tailscale). Linux (glibc-pinned to the
  # oldest Mint base) and darwin are built inside their packaging jobs.
  # NOTE: the outline-sdk dep (unconditional in lantern-box) requires
  # cgo on unix: android builds with the runner's NDK (CC + CXX + extld
  # clang++ for its C++ parts, -checklinkname=0 for the libbox
  # linkname); windows builds CGO-free.
  lantern-box:
    name: Port lantern-box (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      BOX_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-amd64, goos: windows, goarch: amd64,
              out: lantern-box-windows-amd64.exe }
          - { target: windows-386,  goos: windows, goarch: "386",
              out: lantern-box-windows-386.exe }
          - { target: android-arm64, goos: android, goarch: arm64,
              out: "android-arm64/liblanternbox.so",
              cc: aarch64-linux-android26 }
          - { target: android-arm,   goos: android, goarch: arm,
              goarm: "7", out: "android-arm/liblanternbox.so",
              cc: armv7a-linux-androideabi26 }
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Fetch lantern-box source (${{ env.LANTERN_BOX_VERSION }})
        run: |
          curl -fsSL \
            "https://github.com/getlantern/lantern-box/archive/refs/tags/${LANTERN_BOX_VERSION}.tar.gz" \
            | tar xz
          mv lantern-box-* lantern-box-src

      - name: Cross-compile
        run: |
          cd lantern-box-src/cmd
          mkdir -p "../out/$(dirname '${{ matrix.out }}')"
          EXTRA=""
          if [ -n "${{ matrix.goarm }}" ]; then export GOARM=${{ matrix.goarm }}; fi
          if [ "${{ matrix.goos }}" = windows ]; then
            # no cgo needed on windows (the outline smart-dialer's
            # cname.go is pure Go there) and cgo-free avoids the
            # cross-toolchain entirely
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -trimpath \
              -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=lantern-box-${LANTERN_BOX_VERSION}" \
              -tags "$BOX_TAGS" -o "../out/${{ matrix.out }}" .
          else
            NDKBIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              CC="$NDKBIN/${{ matrix.cc }}-clang" \
              CXX="$NDKBIN/${{ matrix.cc }}-clang++" \
              go build -trimpath \
              -ldflags "-s -w -checklinkname=0 \
                -X github.com/sagernet/sing-box/constant.Version=lantern-box-${LANTERN_BOX_VERSION} \
                -extld $NDKBIN/${{ matrix.cc }}-clang++" \
              -tags "$BOX_TAGS" -o "../out/${{ matrix.out }}" .
          fi
          ls -la "../out/${{ matrix.out }}"

      - name: Ship the GPL-3 license alongside
        run: cp lantern-box-src/LICENSE lantern-box-src/out/lantern-box-LICENSE.GPL-3.0

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-box-${{ matrix.target }}
          path: lantern-box-src/out/
          if-no-files-found: error

  # ------------------------------------------------------------- Linux
  # Built on Ubuntu 22.04 (glibc 2.35) so the binaries run on every
  # current Linux Mint base: 21.x (jammy), 22.x (noble) and LMDE 6.
  linux:
    name: Linux (portable + debs + flatpak)
    runs-on: ubuntu-latest
    env:
      BOX_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api
    steps:
      - uses: actions/checkout@v4

      - name: Build onedir + lantern-box in Ubuntu 22.04 (oldest current Mint base)
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e GO_TARBALL -e LANTERN_BOX_VERSION -e BOX_TAGS \
            ubuntu:22.04 bash -exc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              python3 python3-pip libegl1 libgl1 libxkbcommon0 binutils \
              libpython3.10 gcc g++ curl ca-certificates file
            python3 -m pip install -q -U pip
            python3 -m pip install -q -r requirements.txt pyinstaller
            python3 -m PyInstaller --noconfirm --clean \
              --name proto-clean --windowed --onedir \
              --paths . \
              --hidden-import proto_clean.platforms.linux \
              --hidden-import dnslib \
              proto_clean/__main__.py
            dist/proto-clean/proto-clean --version
            # ---- lantern-box (samizdat engine), same glibc floor: the
            # outline-sdk dep needs cgo (CC/CXX=gcc/g++ here)
            curl -fsSL "https://go.dev/dl/${GO_TARBALL}" | tar xz -C /usr/local
            export PATH=/usr/local/go/bin:$PATH
            curl -fsSL \
              "https://github.com/getlantern/lantern-box/archive/refs/tags/${LANTERN_BOX_VERSION}.tar.gz" \
              | tar xz
            mv lantern-box-* /tmp/lb
            cd /tmp/lb/cmd
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
              go build -trimpath \
              -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=lantern-box-${LANTERN_BOX_VERSION}" \
              -tags "$BOX_TAGS" -o /src/dist/proto-clean/lantern-box .
            cd /src
            file dist/proto-clean/lantern-box'
          # docker ran as root: hand dist/ and build/ back to the runner
          sudo chown -R "$(id -u):$(id -g)" dist build 2>/dev/null || true

      - name: Smoke-test the onedir on Mint 21 base (jammy)
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:22.04 bash -exc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
            dist/proto-clean/proto-clean --version'

      - name: Portable tar.gz
        run: |
          tar czf "dist/Proto-Clean-${VERSION}-linux-x86_64-portable.tar.gz" -C dist proto-clean

      - name: Build a deb for every current Mint base
        run: |
          for base in ubuntu:22.04 ubuntu:24.04 debian:bookworm; do
            case "$base" in
              ubuntu:22.04)      short="mint21-ubuntu22.04" ;;
              ubuntu:24.04)      short="mint22-ubuntu24.04" ;;
              debian:bookworm)   short="debian12" ;;
            esac
            # build the package *inside* each base so its toolchain,
            # dependencies and metadata come from that distro
            docker run --rm -v "$PWD":/src -w /src \
              --user "$(id -u):$(id -g)" \
              -e PROTO_CLEAN_VERSION="$VERSION" "$base" bash -exc '
                bash packaging/linux/makedeb.sh'
            mv "dist/proto-clean_${VERSION}-1_amd64.deb" \
               "dist/proto-clean_${VERSION}-${short}_amd64.deb"
            # deb smoke test: the launcher target must exist in the pkg
            dpkg-deb -x "dist/proto-clean_${VERSION}-${short}_amd64.deb" /tmp/debchk
            test -x /tmp/debchk/opt/proto-clean/proto-clean
            test -x /tmp/debchk/opt/proto-clean/lantern-box
            rm -rf /tmp/debchk
          done
          ls -la dist/*.deb

      - name: Build the Flatpak bundle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          # vendor wheels for the runtime's Python (24.08 = py3.12) so the
          # flatpak build sandbox needs no network; the runner's default
          # python (3.13) would vendor cp313-only deps like greenlet
          pip download --python-version 3.12 --only-binary=:all: \
            --dest wheels PySide6 shiboken6 playwright dnslib httpx keyring \
            greenlet
          pip wheel --no-deps -w wheels .
          # the samizdat engine ships inside the sandbox at /app/bin
          install -m 0755 dist/proto-clean/lantern-box \
            packaging/flatpak/lantern-box
          cd packaging/flatpak
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo || true
          flatpak-builder --user --install-deps-from=flathub \
            --force-clean --repo=/tmp/pc-repo /tmp/pc-build \
            app.protoclean.ProtoClean.json
          # flatpak-builder commits to the "master" branch by default
          flatpak build-bundle /tmp/pc-repo \
            "../../dist/Proto-Clean-${VERSION}-x86_64.flatpak" \
            app.protoclean.ProtoClean master

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.flatpak
          if-no-files-found: error

  # ------------------------------------------------------------ Windows
  windows-modern:
    name: Windows 10/11 x64 (portable + setup)
    runs-on: windows-latest
    needs: [lantern-box]
    steps:
      - uses: actions/checkout@v4

      - name: Download the ported lantern-box
        uses: actions/download-artifact@v4
        with:
          name: lantern-box-windows-amd64
          path: lantern-box-bin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (portable)
        run: python -m PyInstaller --noconfirm --clean packaging/windows/proto-clean.spec

      - name: Zip the portable build
        shell: pwsh
        run: |
          Copy-Item packaging/windows/proto-clean.ico dist/
          Copy-Item lantern-box-bin/lantern-box-windows-amd64.exe dist/ProtoClean/lantern-box.exe
          # (no 'version' subcommand in lantern-box; presence via Copy-Item)
          @'
          Proto Clean ${env:VERSION} — Windows 10/11 (64-bit, portable)
          =====================================================

          1. Extract anywhere and run ProtoClean.exe
             (right-click -> Run as administrator is NOT required;
             privileged verbs elevate one batch at a time via UAC).
          2. Install WireGuard for Windows:  https://download.wireguard.com/windows/
          3. Samizdat (Lantern) support is BUNDLED: lantern-box.exe sits
             next to ProtoClean.exe — just import a samizdat:// URL.
          4. Optional Xray proxy (VLESS REALITY / Trojan):
             install Xray-core and put xray.exe on PATH — see README.
          5. First launch downloads a Playwright Chromium for the
             backend-browser login.

          For Windows 7/8 or 32-bit Windows use the -win7- builds instead.
          '@ | Set-Content dist/README-WINDOWS.txt
          Compress-Archive -Path dist/ProtoClean, dist/README-WINDOWS.txt, `
            dist/proto-clean.ico -DestinationPath `
            "dist/Proto-Clean-${env:VERSION}-win-x64-portable.zip" -Force

      - name: Build the Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            packaging/windows/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-modern
          path: |
            dist/*-portable.zip
            dist/*-setup.exe
          if-no-files-found: error

  windows-legacy:
    name: Windows 7+ ${{ matrix.arch }} (portable, Qt5)
    runs-on: windows-latest
    needs: [lantern-box]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86,  installer: python-3.8.10.exe,       bindir: "py38-x86",  boxarch: "386" }
          - { arch: x64,  installer: python-3.8.10-amd64.exe, bindir: "py38-x64",  boxarch: "amd64" }
    steps:
      - uses: actions/checkout@v4

      - name: Download the ported lantern-box
        uses: actions/download-artifact@v4
        with:
          name: lantern-box-windows-${{ matrix.boxarch }}
          path: lantern-box-bin

      - name: Install Python 3.8 (last line with Windows 7 support)
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.8.10/${{ matrix.installer }}"
          Invoke-WebRequest -Uri $url -OutFile py38.exe
          Start-Process -Wait -FilePath .\py38.exe -ArgumentList `
            "/quiet InstallAllUsers=1 TargetDir=C:\${{ matrix.bindir }}"
          C:\${{ matrix.bindir }}\python.exe --version
          C:\${{ matrix.bindir }}\python.exe -m pip install --upgrade pip

      - name: Install build deps (PySide2 / Qt 5.15)
        shell: pwsh
        run: |
          C:\${{ matrix.bindir }}\python.exe -m pip install `
            -r packaging/windows/requirements-legacy.txt `
            PyInstaller==5.13.2

      - name: Build exe
        shell: pwsh
        run: |
          C:\${{ matrix.bindir }}\python.exe -m PyInstaller --noconfirm `
            --clean packaging/windows/proto-clean-legacy.spec

      - name: Zip the portable build
        shell: pwsh
        run: |
          Copy-Item packaging/windows/proto-clean.ico dist/
          Copy-Item "lantern-box-bin/lantern-box-windows-${{ matrix.boxarch }}.exe" dist/ProtoClean/lantern-box.exe
          @'
          Proto Clean ${env:VERSION} — Windows 7 and up (${{ matrix.arch }}, portable)
          ===================================================================

          1. Extract anywhere and run ProtoClean.exe
          2. Install WireGuard for Windows:  https://download.wireguard.com/windows/
          3. Samizdat (Lantern) support is BUNDLED: lantern-box.exe sits
             next to ProtoClean.exe — just import a samizdat:// URL.
          4. Optional Xray proxy (VLESS REALITY / Trojan):
             install Xray-core and put xray.exe on PATH — see README.

          Legacy build: Python 3.8 + Qt 5.15 (PySide2) — the last Qt line
          supporting Windows 7 and 32-bit Windows. The modern Windows 10/11
          x64 build uses Qt 6.
          '@ | Set-Content dist/README-WINDOWS.txt
          Compress-Archive -Path dist/ProtoClean, dist/README-WINDOWS.txt, `
            dist/proto-clean.ico -DestinationPath `
            "dist/Proto-Clean-${env:VERSION}-win7-${{ matrix.arch }}-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-legacy-${{ matrix.arch }}
          path: dist/*-portable.zip
          if-no-files-found: error

  # --------------------------------------------------------------- macOS
  macos:
    name: macOS ${{ matrix.variant }}
    runs-on: macos-latest
    env:
      BOX_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api
    strategy:
      fail-fast: false
      matrix:
        include:
          # Catalina (10.15) build: universal2 Python 3.10 + Qt 6.2
          # (last Qt 6 line that runs on 10.14+), sliced to x86_64.
          - variant: "10.15-catalina-x86_64"
            target_arch: x86_64
            min_ver: "10.15"
            boxarch: amd64
          # Apple Silicon build (macOS 11+): native arm64, modern Qt 6.
          - variant: "11.0-arm64"
            target_arch: ""
            min_ver: "11.0"
            boxarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (lantern-box port)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set up Python
        if: matrix.target_arch == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install universal2 Python 3.10 (Catalina build)
        if: matrix.target_arch == 'x86_64'
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg
          sudo installer -pkg python-3.10.11-macos11.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10 --version
          /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10 -m pip install --upgrade pip

      - name: Install build deps
        run: |
          if [ -n "${{ matrix.target_arch }}" ]; then
            PYBIN=/Library/Frameworks/Python.framework/Versions/3.10/bin
            "$PYBIN/python3.10" -m pip install \
              -r packaging/macos/requirements-legacy.txt PyInstaller==5.13.2
            # the Catalina build swaps the app requirements to the legacy
            # stack (PySide6 6.2.4, universal2) for packaging/macos/build.sh
            cp packaging/macos/requirements-legacy.txt requirements.txt
          else
            python3 -m pip install -r requirements.txt pyinstaller
          fi

      - name: Build .app
        run: |
          export MACOS_MIN_SYSTEM_VERSION="${{ matrix.min_ver }}"
          export PROTO_TARGET_ARCH="${{ matrix.target_arch }}"
          if [ -n "$PROTO_TARGET_ARCH" ]; then
            export PATH="/Library/Frameworks/Python.framework/Versions/3.10/bin:$PATH"
          fi
          bash packaging/macos/build.sh

      - name: Build lantern-box (samizdat engine) and bundle it
        run: |
          curl -fsSL \
            "https://github.com/getlantern/lantern-box/archive/refs/tags/${LANTERN_BOX_VERSION}.tar.gz" \
            | tar xz
          mv lantern-box-* lantern-box-src
          cd lantern-box-src/cmd
          # darwin needs cgo for the outline-sdk dep; Xcode clang builds
          # both slices natively (catalina job cross-builds amd64)
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.boxarch }} \
            CC=clang CXX=clang++ go build -trimpath \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=lantern-box-${LANTERN_BOX_VERSION} -extld clang++" \
            -tags "$BOX_TAGS" \
            -o "$GITHUB_WORKSPACE/dist/Proto Clean.app/Contents/MacOS/lantern-box" .
          cd "$GITHUB_WORKSPACE"

      - name: Zip the .app (portable)
        run: |
          cd dist
          zip -qry "Proto-Clean-${VERSION}-macos-${{ matrix.variant }}-portable.zip" "Proto Clean.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.variant }}
          path: dist/*-portable.zip
          if-no-files-found: error

  # ------------------------------------------------------------- Android
  android:
    name: Android 8.0+ (armv7 + arm64 APKs)
    runs-on: ubuntu-latest
    needs: [lantern-box]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Download the ported lantern-box (Android)
        uses: actions/download-artifact@v4
        with:
          path: lantern-box-bin
          pattern: lantern-box-android-*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Place lantern-box into jniLibs (nativeLibraryDir exec trick)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a \
                   app/src/main/jniLibs/armeabi-v7a
          install -m 0755 ../lantern-box-bin/lantern-box-android-arm64/android-arm64/liblanternbox.so \
            app/src/main/jniLibs/arm64-v8a/liblanternbox.so
          install -m 0755 ../lantern-box-bin/lantern-box-android-arm/android-arm/liblanternbox.so \
            app/src/main/jniLibs/armeabi-v7a/liblanternbox.so
          ls -la app/src/main/jniLibs/*/

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PROTO_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PROTO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROTO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PROTO_ANDROID_KEY_PASSWORD }}
        run: |
          # Release-signed, non-debuggable APKs are what Play Protect
          # expects from a sideloaded app: debug/test-key APKs trigger
          # the "unsafe app blocked" biometric confirmation.
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/protoclean-release.keystore"
            echo "PC_KEYSTORE_FILE=$GITHUB_WORKSPACE/protoclean-release.keystore" >> "$GITHUB_ENV"
            echo "PC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PC_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PC_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::PROTO_ANDROID_KEYSTORE_B64 secret not set — release APKs will be debug-signed"
          fi

      - name: Build release APKs (release-signed when the keystore is present)
        run: gradle assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
             "$GITHUB_WORKSPACE/Proto-Clean-${VERSION}-android-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk \
             "$GITHUB_WORKSPACE/Proto-Clean-${VERSION}-android-arm64-v8a.apk"

      - name: Verify APK signatures (v1/v2/v3 schemes)
        run: |
          # Fail loudly if the APKs somehow shipped unsigned — an unsigned
          # or debug-signed artifact is what Play Protect flags as unsafe.
          BT="$ANDROID_HOME/build-tools/34.0.0"
          for apk in "$GITHUB_WORKSPACE"/Proto-Clean-*-android-*.apk; do
            echo "== $apk"
            "$BT/apksigner" verify --min-sdk-version 26 "$apk"
            "$BT/apksigner" verify --print-certs "$apk" | head -6
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            Proto-Clean-*-android-armeabi-v7a.apk
            Proto-Clean-*-android-arm64-v8a.apk
          if-no-files-found: error

  # ------------------------------------------------------------- Publish
  publish:
    name: Publish GitHub Release
    needs: [linux, windows-modern, windows-legacy, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Proto Clean v${{ env.VERSION }}
          body: |
            New in v0.6.2: **default blocklists now match uBlock
            Origin's out-of-the-box set** —

            * **Same defaults as uBlock Origin**: content blocking now
              ships with the exact filter lists uBlock Origin enables
              by default — the five built-in uBlock filters lists
              (Quick fixes, Privacy, Badware risks…), **EasyList**,
              **EasyPrivacy**, the **Online Malicious URL Blocklist**
              and **Peter Lowe's Ad servers** — replacing the single
              StevenBlack hosts file, on desktop and Android alike.
            * **Smarter filter engine**: a new parser understands hosts
              files, per-line domain lists and Adblock/uBlock syntax —
              extracting `||domain^` network rules and `@@||domain^`
              exceptions while skipping browser-context rules (cosmetic,
              scriptlet, HTML and URL-specific rules), so a URL-level
              rule for a shared host can never block the whole shared
              domain.
            * **Exceptions done right**: DomainFilter now supports
              exception rules with most-specific-wins semantics.
            * **Safe migration**: settings still holding the old
              single-list default switch to the new set on load;
              customized lists are never touched, and removed defaults
              stay re-addable from the presets.
            * **Desktop fix**: expanding a region via the server tree's
              arrow (or double-click) no longer desyncs the expansion
              state — the next server-list refresh no longer collapses
              regions you opened.

            Also new in v0.6.1: **region-grouped server list + guest-mode
            fixes + release-signed Android APKs** —

            * **Server list, reworked**: servers are grouped under
              collapsible **region headers** on every platform — press a
              region to expand its servers, each showing its **live
              load**; the headers show the region's server count and
              average load (desktop Qt tree + Android Compose list).
            * **Guest mode — loads fixed**: the server list now shows
              real load percentages instead of 0% (the v1 logicals
              endpoint carries live loads inline; when only the v2
              endpoint is reachable, loads are merged from
              `/vpn/v1/loads`).
            * **Guest mode — connect fixed**: guest connections now use
              the official certificate key flow — the request carries
              the session's Ed25519 device public key as a PKIX PEM and
              the WireGuard private key is derived from the same
              keypair. This replaces the raw X25519 key that Proton
              rejected with Code 2001 "unable to read the key, please
              provide valid EC key".
            * **Android**: the APKs are **release-signed** (v1+v2+v3
              schemes, non-debuggable) so Google Play Protect no longer
              flags them as unsafe debug builds during install.

            Also new in v0.6.0: **Guest mode + Material Design 3 UI** —
            "Continue as guest" via Proton's credentialless API flow
            (no account, no CAPTCHA, no Playwright; free-tier servers,
            auto-resume via refresh-token, WireGuard certs from the API
            with the wg-quick config built locally), plus a full
            **Material Design 3** interface: HCT tonal palettes
            (CIELAB-backed), all 30+ MD3 color roles, MD3 widget styles
            seeded from the Proto Clean pine-green, and a matching MD3
            theme on Android.

            The v0.6.0 builds also shipped the final hardening passes: a
            **performance / stability / memory** pass across all
            platforms — QUIC-obfs & salamander whitening 28× faster,
            QUIC flow-control windows 1→8 MiB (≈10× on 150 ms-RTT
            paths), 256 KiB relay chunks (~7× bulk throughput),
            O(n²) SS/MASQUE decrypt buffers compacted to 74+ MB/s,
            QUIC idle keepalive + TCP keepalive to survive NAT idle
            drops, bounded child-output tails (no more pipe-full
            tunnel deadlocks), zero thread/event-loop/socket leaks
            across connect cycles, SOCKS5-UDP session lifecycle caps
            — and a **final interop series**: 42 cross-feature tests
            over the real production paths (chains, WARP hops, the
            whole import universe, QR round-trips, guest-mode ↔
            WireGuard, controller lifecycle) with 6 composition fixes
            they flushed out. 684 tests passing.

