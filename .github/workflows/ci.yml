name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.qt }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        qt: [PySide6]
        include:
          # legacy stack kept continuously green: Python 3.8 with the
          # PySide6 6.2.4 wheels it resolves to, and the Qt 5 / PySide2
          # path used by the Windows 7 / 32-bit builds (via qtcompat)
          - { os: ubuntu-latest, python-version: "3.8", qt: PySide6-6.2 }
          - { os: ubuntu-latest, python-version: "3.8", qt: PySide2-Qt5 }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Swap in PySide2 (Qt 5 legacy stack)
        if: matrix.qt == 'PySide2-Qt5'
        run: |
          pip uninstall -y PySide6 PySide6-Essentials PySide6-Addons shiboken6 || true
          pip install PySide2==5.15.2.1

      - name: Byte-compile check
        run: python -m compileall -q proto_clean

      - name: Run tests
        run: pytest tests/ -q

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Smoke-test wheel install
        run: |
          pip install dist/*.whl
          python -c "import proto_clean, proto_clean.settings, proto_clean.vpn.wgconf, proto_clean.vpn.xrayconf; print('wheel OK:', proto_clean.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
